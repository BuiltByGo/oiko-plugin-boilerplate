name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}

      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse
      - run: vendor/bin/phpunit

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install production dependencies
        run: composer install --prefer-dist --no-progress --no-dev

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          # This repo is a boilerplate/dev checkout, not a built plugin
          # artifact — the actual shipped plugin is just the PHP source,
          # assets, and languages/ directory. Everything else here is
          # repo-level dev tooling (CI config, docs, test suite, hidden
          # config files) that never ships in the plugin zip, so it's
          # excluded from the scan rather than fixed to satisfy checks
          # that don't apply to it.
          slug: example-plugin
          exclude-directories: vendor,tests,.github,.phpunit.cache,.superpowers
          exclude-files: .gitignore,.wp-env.json,.phpstan-bootstrap.php,AGENTS.md,CLAUDE.md,PERFORMANCE.md,phpcs.xml.dist,phpstan.neon.dist,phpunit.xml
